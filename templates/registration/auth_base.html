{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shopping_App — Authentication{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Sign in or create a Shopping_App account.{% endblock %}">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- TailwindCSS via CDN (utility layer only; no build step) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50:  '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    boxShadow: {
                        'card': '0 25px 50px -12px rgba(0, 0, 0, 0.18), 0 12px 30px -10px rgba(59, 130, 246, 0.18)',
                        'soft': '0 6px 24px -8px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.04)',
                    },
                    borderRadius: {
                        'xl2': '20px',
                    }
                }
            }
        }
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --auth-text:    #0f172a;
            --auth-muted:   #64748b;
            --auth-border:  #e2e8f0;
            --auth-border-strong: #cbd5e1;
            --auth-input-bg: #ffffff;
            --auth-radius-card: 20px;
            --auth-radius-input: 12px;
            --auth-radius-btn: 12px;
            --auth-shadow-card: 0 25px 50px -12px rgba(15, 23, 42, 0.18), 0 12px 30px -10px rgba(59, 130, 246, 0.18);
            --auth-blue-1: #2563eb;
            --auth-blue-2: #1d4ed8;
            --auth-blue-3: #3b82f6;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--auth-text);
            background:
                radial-gradient(1200px 800px at 0% 0%,   rgba(59,130,246,0.10), transparent 60%),
                radial-gradient(1000px 700px at 100% 100%, rgba(37,99,235,0.10), transparent 60%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* ── Soft Background Blobs (subtle) ── */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 480px; height: 480px;
            top: -120px; right: -120px;
            background: radial-gradient(circle, #93c5fd, transparent 70%);
            animation: blobFloat 12s ease-in-out infinite alternate;
        }
        body::after {
            width: 420px; height: 420px;
            bottom: -120px; left: -120px;
            background: radial-gradient(circle, #c4b5fd, transparent 70%);
            animation: blobFloat 14s ease-in-out infinite alternate-reverse;
        }
        @keyframes blobFloat {
            0%   { transform: translate(0,0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.08); }
        }

        /* ── Wrapper ── */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* ── Brand ── */
        .auth-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            text-decoration: none;
            color: var(--auth-text);
        }
        .auth-brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(37,99,235,0.35);
            color: #fff;
            font-size: 18px;
        }
        .auth-brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }
        .auth-brand-tagline {
            font-size: 11px;
            color: var(--auth-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ── Card ── */
        .auth-card {
            background: #ffffff;
            border-radius: var(--auth-radius-card);
            box-shadow: var(--auth-shadow-card);
            width: 100%;
            max-width: 850px;
            padding: 0;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 540px;
            animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            position: relative;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Left Side: Form ── */
        .auth-side-form {
            padding: 44px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .auth-card-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: var(--auth-text);
            margin-bottom: 4px;
        }
        .auth-card-subtitle {
            font-size: 14px;
            color: var(--auth-muted);
            margin-bottom: 26px;
            line-height: 1.55;
        }

        /* ── Right Side: Blue Panel ── */
        .auth-side-panel {
            background:
                radial-gradient(800px 500px at 80% 0%, rgba(255,255,255,0.18), transparent 60%),
                linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 44px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .auth-side-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08) 0, transparent 40%);
            pointer-events: none;
        }
        .auth-panel-eyebrow {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.85;
            margin-bottom: 12px;
        }
        .auth-panel-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.1;
            margin-bottom: 14px;
        }
        .auth-panel-text {
            font-size: 14px;
            line-height: 1.65;
            opacity: 0.9;
            margin-bottom: 26px;
            max-width: 280px;
            margin-left: auto;
            margin-right: auto;
        }
        .auth-panel-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffffff;
            color: #1d4ed8;
            padding: 12px 26px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .auth-panel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0,0,0,0.18);
            background: #f8fafc;
        }
        .auth-panel-btn:active { transform: translateY(0); }

        /* ── Form Controls ── */
        .auth-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            display: block;
        }

        .auth-input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--auth-border);
            border-radius: var(--auth-radius-input);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--auth-text);
            background: var(--auth-input-bg);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            outline: none;
        }
        .auth-input::placeholder { color: #94a3b8; }
        .auth-input:focus {
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.14);
        }
        .auth-input.is-invalid {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239,68,68,0.10);
        }

        .auth-input-group {
            position: relative;
        }
        .auth-input-group .auth-input { padding-right: 44px; }
        .auth-input-toggle {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: #94a3b8;
            font-size: 15px;
            padding: 6px;
            line-height: 1;
            transition: color 0.2s ease;
        }
        .auth-input-toggle:hover { color: #2563eb; }

        .auth-form-group { margin-bottom: 16px; }

        /* ── Primary Button ── */
        .auth-btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: var(--auth-radius-btn);
            font-size: 14.5px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            position: relative;
        }
        .auth-btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(37,99,235,0.35);
        }
        .auth-btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            box-shadow: 0 12px 26px rgba(37,99,235,0.45);
            transform: translateY(-1px);
        }
        .auth-btn-primary:active:not(:disabled) { transform: translateY(0); }
        .auth-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .auth-btn-outline {
            background: transparent;
            color: #334155;
            border: 1.5px solid var(--auth-border);
        }
        .auth-btn-outline:hover {
            background: #f8fafc;
            border-color: var(--auth-border-strong);
        }

        /* ── Links ── */
        .auth-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            transition: color 0.2s ease;
        }
        .auth-link:hover { color: #1d4ed8; text-decoration: underline; }

        /* ── Divider ── */
        .auth-divider {
            display: flex; align-items: center; gap: 12px;
            margin: 18px 0 14px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
        }
        .auth-divider::before, .auth-divider::after {
            content: ''; flex: 1;
            height: 1px;
            background: var(--auth-border);
        }

        /* ── Social Icons (placeholder only) ── */
        .auth-social-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 4px;
        }
        .auth-social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--auth-border);
            background: #ffffff;
            color: #64748b;
            font-size: 17px;
            cursor: default;
            transition: transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }
        .auth-social-icon:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(15,23,42,0.08);
        }
        .auth-social-icon[data-brand="google"]:hover   { color: #ea4335; border-color: #fca5a5; }
        .auth-social-icon[data-brand="facebook"]:hover { color: #1877f2; border-color: #93c5fd; }
        .auth-social-icon[data-brand="github"]:hover   { color: #0f172a; border-color: #cbd5e1; }
        .auth-social-icon[data-brand="linkedin"]:hover { color: #0a66c2; border-color: #93c5fd; }

        /* ── Alerts ── */
        .auth-alert {
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex; align-items: flex-start; gap: 8px;
            animation: alertIn 0.3s ease;
        }
        @keyframes alertIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }
        .auth-alert-danger  { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .auth-alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .auth-alert-info    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

        /* ── Footer Text ── */
        .auth-footer-text {
            text-align: center;
            font-size: 13px;
            color: var(--auth-muted);
            margin-top: 18px;
        }
        .auth-footer-note {
            font-size: 11.5px;
            color: #94a3b8;
            text-align: center;
            margin-top: 14px;
            line-height: 1.6;
        }

        /* ── Spinner ── */
        .auth-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Mode Slide Animation ── */
        .auth-mode-section {
            transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .auth-mode-section.is-hidden {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
            position: absolute;
            inset: 44px;
            visibility: hidden;
        }
        .auth-mode-section.is-active {
            opacity: 1;
            transform: translateX(0);
            position: relative;
            visibility: visible;
        }

        /* ── Password Strength ── */
        .pw-strength-bar {
            height: 3px;
            border-radius: 2px;
            background: #e2e8f0;
            margin-top: 8px;
            overflow: hidden;
        }
        .pw-strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.35s ease, background 0.35s ease;
            width: 0%;
        }
        .pw-strength-text {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* ── OTP Inputs ── */
        .otp-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .otp-box {
            width: 52px; height: 58px;
            border: 2px solid var(--auth-border);
            border-radius: 12px;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: var(--auth-text);
            background: #ffffff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .otp-box:focus {
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.14);
        }
        .otp-box.filled {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        /* ── Timer ── */
        .auth-timer {
            font-size: 13px;
            color: var(--auth-muted);
            text-align: center;
            margin-top: 12px;
        }
        .auth-timer .countdown {
            font-weight: 700;
            color: #2563eb;
            font-variant-numeric: tabular-nums;
        }
        .auth-timer .countdown.expired { color: #ef4444; }

        /* ── Step Indicator ── */
        .auth-steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 22px;
        }
        .auth-step-dot {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
            transition: all 0.3s;
        }
        .auth-step-dot.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            box-shadow: 0 2px 8px rgba(37,99,235,0.4);
        }
        .auth-step-dot.done {
            background: #d1fae5; color: #059669;
        }
        .auth-step-dot.pending {
            background: #f1f5f9; color: #94a3b8;
        }
        .auth-step-line {
            width: 36px; height: 2px;
            background: #e2e8f0;
        }
        .auth-step-line.done { background: linear-gradient(90deg, #2563eb, #1d4ed8); }

        /* ── Single-column templates wrap into full width when no right panel ── */
        .auth-card.is-single {
            grid-template-columns: 1fr;
            max-width: 480px;
            min-height: 0;
        }
        .auth-card.is-single .auth-side-form {
            padding: 40px 36px;
            grid-column: 1 / -1;
        }

        @media (max-width: 820px) {
            .auth-card {
                grid-template-columns: 1fr;
                max-width: 480px;
                min-height: 0;
            }
            .auth-side-form { padding: 32px 26px; }
            .auth-side-panel { padding: 28px 26px; }
            .auth-card-title { font-size: 22px; }
            .auth-panel-title { font-size: 24px; }
            .auth-mode-section.is-hidden { inset: 32px 26px; }
        }
        @media (max-width: 480px) {
            .auth-side-form { padding: 26px 20px; }
            .auth-side-panel { padding: 24px 20px; }
            .otp-box { width: 42px; height: 50px; font-size: 20px; }
        }

        /* ── Field-level errors ── */
        .field-error {
            font-size: 12px;
            color: #dc2626;
            margin-top: 4px;
            font-weight: 500;
        }

        /* ── Lock body scroll when card is animating ── */
        .fade-in { animation: fadeIn 0.4s ease both; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Brand -->
        <a href="{% url 'home' %}" class="auth-brand">
            <div class="auth-brand-icon">
                <i class="fa-solid fa-bag-shopping"></i>
            </div>
            <div>
                <div class="auth-brand-name">Shopping_App</div>
                <div class="auth-brand-tagline">Premium E-Commerce</div>
            </div>
        </a>

        <!-- Auth Card -->
        <div class="auth-card {% block auth_card_class %}{% endblock %}">
            {% block auth_content %}{% endblock %}
        </div>

        <!-- Card Footer -->
        {% block auth_footer %}{% endblock %}
    </div>

    <!-- CSRF Cookie Helper -->
    <script>
        function getCookie(name) {
            let v = null;
            if (document.cookie && document.cookie !== '') {
                document.cookie.split(';').forEach(c => {
                    c = c.trim();
                    if (c.startsWith(name + '=')) v = decodeURIComponent(c.slice(name.length + 1));
                });
            }
            return v;
        }
        // Helper: query selector shorthand
        const $  = (s, c = document) => c.querySelector(s);
        const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
