{% extends "registration/auth_base.html" %}
{% block title %}Password Changed — Shopping_App{% endblock %}

{% block auth_content %}
<div class="text-center">
    <div style="width:64px;height:64px;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 4px 16px rgba(34,197,94,0.35);">
        <i class="fa-solid fa-shield-check" style="font-size:26px;color:#fff;"></i>
    </div>
    <h1 class="auth-card-title">Password changed!</h1>
    <p class="auth-card-subtitle">Your password has been updated successfully. You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="auth-btn auth-btn-primary" style="text-decoration:none;display:flex;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In Now
    </a>
</div>
{% endblock %}
